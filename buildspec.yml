version: 0.2

env:
  variables:
    APP_NAME: "CyberArcade"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Checking runtime environment..."
      - aws --version
      - node -v
      - if [ -f package.json ]; then npm ci || npm install; fi

  pre_build:
    commands:
      - echo "Running pre-build checks..."
      - if [ -f scripts/build-check.js ]; then node scripts/build-check.js; fi

  build:
    commands:
      - echo "Checking S3 destination bucket..."
      - test -n "$S3_BUCKET"
      - echo "Syncing files to S3 bucket $S3_BUCKET..."
      - aws s3 sync . "s3://$S3_BUCKET" --delete --exclude ".git/*" --exclude "node_modules/*" --exclude "buildspec*.yml"

  post_build:
    commands:
      - echo "Deployment sync finished successfully."

artifacts:
  files:
    - "**/*"
  discard-paths: no
