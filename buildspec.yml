version: 0.2

# AWS CodeBuild Specification for Direct S3 Deployment
# Required CodeBuild Environment Variable:
#   - S3_BUCKET: Name of your destination S3 bucket

env:
  variables:
    APP_NAME: "CyberArcade"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Checking environment..."
      - aws --version
      - node -v
      - |
        if [ -f package.json ]; then
          echo "Installing dependencies..."
          npm ci || npm install
        fi

  pre_build:
    commands:
      - echo "Running verification suite..."
      - |
        if [ -f scripts/build-check.js ]; then
          node scripts/build-check.js
        fi

  build:
    commands:
      - echo "Syncing files to S3 bucket: $S3_BUCKET"
      - |
        if [ -n "$S3_BUCKET" ]; then
          aws s3 sync . s3://$S3_BUCKET --delete --exclude ".git/*" --exclude "node_modules/*" --exclude "buildspec*.yml"
          echo "S3 sync completed successfully!"
        else
          echo "Error: S3_BUCKET environment variable is not set."
          exit 1
        fi

  post_build:
    commands:
      - echo "Deployment completed at $(date)"

artifacts:
  files:
    - '**/*'
  discard-paths: no
